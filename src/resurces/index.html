<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пошук товарів</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; background-color: #f4f4f4; }
        input[type="text"] { width: 300px; padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; background-color: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Пошук товарів у базі даних</h1>
    <!-- Фікс 1: action -->
    <form action="/cgi-bin/search.cgi" method="GET">
        <input type="text" name="q" placeholder="Наприклад: Dell">
        <button type="submit">Знайти</button>
    </form>
</body>
</html>
