<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Головна</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; background-color: #f4f4f4; }
        h1 { color: #333; }
        input[type="text"] { width: 300px; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <h1>Пошук товарів у базі даних</h1>
    <p>Введіть назву, виробника або код товару:</p>
    <form id="searchForm">
        <input type="text" id="query" name="q" placeholder="Наприклад: Dell">
        <button type="submit">Знайти</button>
    </form>
</body>
</html>
